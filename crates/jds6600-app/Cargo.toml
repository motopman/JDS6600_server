[package]
name = "jds6600-app"
version = "0.1.0"
edition = "2021"
description = "GUI wrapper with system tray and QR code window for the JDS6600 server"
rust-version = "1.80"

[[bin]]
name = "jds6600-app"
path = "src/main.rs"

[dependencies]
jds6600-core = { path = "../jds6600-core" }

# GUI
eframe = "0.27"
egui   = "0.27"

# Tray icon (from the Tauri project – natively supports Win/macOS/Linux)
tray-icon = "0.14"

# QR code + image processing
qrcode = "0.13"
image  = "0.24"

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Network utility
local-ip-address = "0.6"

# Open files in the default OS application (for "Save log" feature)
open = "5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "winnt", "minwindef"] }
